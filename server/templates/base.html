<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbf9f5">
    <title>{% block title %}{{page_title if page_title else 'Parrot — Discord bot'}}{% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- <link rel="stylesheet" href="{{ url_for('static', path='css/retro.css') }}"> -->
  <style type="text/tailwindcss">
    /* Dark */
    :root {
      --bg: #121110;
      --surface: #1c1a18;
      --elevated-card: #262320;
      --border: #332f2b;
      --text-primary: #f5f2eb;
      --text-muted: #a8a29e;
      --primary: #5865f2;
      --hover-primary: #6875f5;
      --secondary: #34d399;
    }
    @theme inline {
      --color-bg: var(--bg);
      --color-surface: var(--surface);
      --color-elevated-card: var(--elevated-card);
      --color-border: var(--border);
      --color-text-primary: var(--text-primary);
      --color-text-muted: var(--text-muted);
      --color-primary: var(--primary);
      --color-hover-primary: var(--hover-primary);
      --color-secondary: var(--secondary);
    }
  </style>
</head>

<body class="bg-bg text-text-primary min-h-screen min-w-screen">
    {% block content %}{% endblock %}

    <!-- <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script> -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
    {% block scripts %}{% endblock %}
</body>

</html>
